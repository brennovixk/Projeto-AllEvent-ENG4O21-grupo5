{% extends 'base.html' %}
{% load static %}

{% block title %}Cadastro - AllEvent{% endblock %}

{% block header %}
    <header class="site-header compact">
        <a href="{% url 'home' %}" class="logo-text" style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 2.2rem; color: white; text-decoration: none;">AllEvent</a>
    </header>
{% endblock header %}

{% block content %}
<main class="main-content">
    <div class="auth-card">
        
        {% if messages %}
            {% for message in messages %}
                <p style="color: red; margin-bottom: 10px;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form class="auth-form" method="POST">
            {% csrf_token %}
            <input type="text" name="nome_completo" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="password" placeholder="Senha" required>
            <input type="password" name="password_confirm" placeholder="Confirme a senha" required>
            <button type="submit" class="btn btn-primary">CRIAR CONTA</button>
        </form>
    </div>
</main>
{% endblock content %}
